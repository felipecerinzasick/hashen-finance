<style>
  .sidebar .nav-link-local {
    display: flex !important;
    align-items: center !important;
    justify-content: flex-start !important;
    gap: 9px;
    min-height: 38px !important;
    height: auto !important;
  }

  .sidebar .nav-list {
    align-content: start !important;
    grid-auto-rows: max-content !important;
  }

  .sidebar .nav-icon {
    width: 15px;
    height: 15px;
    min-width: 15px;
    min-height: 15px !important;
    max-width: 15px;
    max-height: 15px;
    display: block !important;
    flex: 0 0 auto;
  }

  @media (max-width: 1100px) {
    .dashboard-shell {
      grid-template-columns: 1fr !important;
    }

    body {
      background:
        linear-gradient(180deg, rgba(235, 243, 238, 0.9) 0, rgba(245, 248, 251, 0) 260px),
        #f5f8fb !important;
    }

    .sidebar {
      display: block !important;
      position: sticky;
      top: 0;
      z-index: 40;
      height: auto;
      max-width: 100vw;
      padding: 8px 10px 9px;
      background:
        linear-gradient(135deg, #10231f 0%, #173c32 58%, #4a381d 100%) !important;
      border-bottom: 1px solid rgba(217, 182, 106, 0.2);
      overflow: visible;
      box-shadow: 0 12px 30px rgba(15, 38, 56, 0.2);
    }

    .sidebar .brand {
      display: none;
    }

    .sidebar .nav-list {
      display: flex !important;
      align-items: center;
      gap: 8px;
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0 1px 2px;
      margin: 0;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .sidebar .nav-list::-webkit-scrollbar {
      display: none;
    }

    .sidebar .nav-link-local,
    .sidebar .nav-sublist a {
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      height: 34px !important;
      min-height: 34px !important;
      padding: 0 12px !important;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.09);
      color: #e4ece8;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .sidebar .nav-icon {
      width: 14px;
      height: 14px;
      min-width: 14px;
      min-height: 14px !important;
      max-width: 14px;
      max-height: 14px;
    }

    .sidebar .nav-link-local.active,
    .sidebar .nav-link-local:hover,
    .sidebar .nav-sublist a.active,
    .sidebar .nav-sublist a:hover {
      background: #d9b66a;
      border-color: #d9b66a;
      color: #172421;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
    }

    .sidebar .nav-sublist {
      display: contents !important;
    }

    .content .topbar {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(239, 247, 242, 0.92)) !important;
      border-bottom-color: rgba(31, 111, 86, 0.14) !important;
      box-shadow: 0 10px 26px rgba(29, 47, 42, 0.08);
    }
  }

  @media (max-width: 640px) {
    .sidebar {
      padding: 7px 8px 8px;
    }

    .sidebar .nav-list {
      gap: 6px;
    }

    .sidebar .nav-link-local,
    .sidebar .nav-sublist a {
      height: 31px !important;
      min-height: 31px !important;
      padding: 0 10px !important;
      font-size: 12px;
    }
  }
</style>
<aside class="sidebar">
  <a class="brand" href="{% url 'index' %}" aria-label="Open Hashen landing page">
    <div class="brand-mark">H</div>
    <div>
      <strong>Hashen</strong>
      <span>Private wealth console</span>
    </div>
  </a>
  <nav class="nav-list" aria-label="Private console navigation">
    <a class="nav-link-local {% if active_page == 'overview' %}active{% endif %}" href="{% url 'dashboard' %}">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h7V4H4v9Zm0 7h7v-5H4v5Zm9 0h7v-9h-7v9Zm0-11h7V4h-7v5Z" fill="currentColor"/></svg>
      <span>Overview</span>
    </a>
    <a class="nav-link-local {% if active_page == 'stocks' %}active{% endif %}" href="{% url 'stocks_dashboard' %}">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16v2H4v-2Zm1-3 4-5 4 3 5-8 2 1-6 10-4-3-3 4-2-2Z" fill="currentColor"/></svg>
      <span>Stocks</span>
    </a>
    <div class="nav-sublist" aria-label="Treasury stock pages">
      <a class="{% if active_treasury == 'mstr' %}active{% endif %}" href="{% url 'mstr_dashboard' %}"><span>MSTR</span></a>
      <a class="{% if active_treasury == 'metaplanet' %}active{% endif %}" href="{% url 'treasury_stock_dashboard' 'metaplanet' %}"><span>Metaplanet</span></a>
      <a class="{% if active_treasury == 'asst' %}active{% endif %}" href="{% url 'treasury_stock_dashboard' 'asst' %}"><span>ASST</span></a>
      <a class="{% if active_treasury == 'bitmine' %}active{% endif %}" href="{% url 'treasury_stock_dashboard' 'bitmine' %}"><span>BitMine</span></a>
    </div>
    <a class="nav-link-local {% if active_page == 'reports' %}active{% endif %}" href="{% url 'portfolio_reports' %}">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h9l5 5v15H6V2Zm8 1.5V8h4.5L14 3.5ZM8 12h8v2H8v-2Zm0 4h8v2H8v-2Z" fill="currentColor"/></svg>
      <span>Reports</span>
    </a>
    <a class="nav-link-local {% if active_page == 'memos' %}active{% endif %}" href="{% url 'memos' %}">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18H5V3Zm3 4v2h8V7H8Zm0 4v2h8v-2H8Zm0 4v2h5v-2H8Z" fill="currentColor"/></svg>
      <span>Memos</span>
    </a>
  </nav>
</aside>
