<style>
  @media (max-width: 1100px) {
    .dashboard-shell {
      grid-template-columns: 1fr !important;
    }

    .sidebar {
      display: grid !important;
      grid-template-columns: 1fr;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 40;
      height: auto;
      max-width: 100vw;
      padding: 10px 12px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }

    .sidebar .brand {
      margin: 0;
      min-width: 0;
    }

    .sidebar .brand-mark {
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
    }

    .sidebar .brand strong {
      font-size: 14px;
    }

    .sidebar .brand span {
      display: none;
    }

    .sidebar .nav-list {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0 2px 4px;
      margin: 0 -2px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .sidebar .nav-list::-webkit-scrollbar {
      display: none;
    }

    .sidebar .nav-link-local,
    .sidebar .nav-sublist a {
      flex: 0 0 auto;
      min-height: 36px;
      padding: 8px 11px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: #d8dee9;
      font-size: 13px;
      line-height: 1;
      white-space: nowrap;
    }

    .sidebar .nav-link-local.active,
    .sidebar .nav-link-local:hover,
    .sidebar .nav-sublist a.active,
    .sidebar .nav-sublist a:hover {
      background: #ffffff;
      border-color: #ffffff;
      color: #123044;
    }

    .sidebar .nav-sublist {
      display: flex;
      flex: 0 0 auto;
      gap: 8px;
      margin: 0;
      padding: 0;
      border-left: 0;
    }
  }
</style>
<aside class="sidebar">
  <a class="brand" href="{% url 'index' %}" aria-label="Open Hashen landing page">
    <div class="brand-mark">H</div>
    <div>
      <strong>Hashen</strong>
      <span>Private wealth console</span>
    </div>
  </a>
  <nav class="nav-list" aria-label="Private console navigation">
    <a class="nav-link-local {% if active_page == 'overview' %}active{% endif %}" href="{% url 'dashboard' %}"><span>Overview</span></a>
    <a class="nav-link-local {% if active_page == 'stocks' %}active{% endif %}" href="{% url 'stocks_dashboard' %}"><span>Stocks</span></a>
    <div class="nav-sublist" aria-label="Treasury stock pages">
      <a class="{% if active_treasury == 'mstr' %}active{% endif %}" href="{% url 'mstr_dashboard' %}"><span>MSTR</span></a>
      <a class="{% if active_treasury == 'metaplanet' %}active{% endif %}" href="{% url 'treasury_stock_dashboard' 'metaplanet' %}"><span>Metaplanet</span></a>
      <a class="{% if active_treasury == 'asst' %}active{% endif %}" href="{% url 'treasury_stock_dashboard' 'asst' %}"><span>ASST</span></a>
      <a class="{% if active_treasury == 'bitmine' %}active{% endif %}" href="{% url 'treasury_stock_dashboard' 'bitmine' %}"><span>BitMine</span></a>
    </div>
    <a class="nav-link-local {% if active_page == 'reports' %}active{% endif %}" href="{% url 'portfolio_reports' %}"><span>Reports</span></a>
    <a class="nav-link-local {% if active_page == 'memos' %}active{% endif %}" href="{% url 'memos' %}"><span>Memos</span></a>
  </nav>
</aside>
